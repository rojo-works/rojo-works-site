<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路 R O J O 上 — rojo.works</title>
  <meta name="description" content="路 R O J O 上 (rojo.works) — A practice in Ueda. Articles · Dialog · Small Rental Property.">
  <meta name="theme-color" content="#f0f0f0">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="路 R O J O 上">
  <meta property="og:description" content="A practice in Ueda. Articles · Dialog · Small Rental Property.">
  <meta property="og:url" content="https://rojo.works/">
  <meta property="og:site_name" content="路 R O J O 上">

  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

  <style>
    @font-face {
      font-family: 'LINE Seed JP';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/fonts/line-seed-jp-regular.woff2') format('woff2');
    }

    :root {
      --bg: #f0f0f0;
      --text: #2b2b2b;
      --text-sub: #6b6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'LINE Seed JP', YuGothic, "Yu Gothic", "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", "Helvetica Neue", Arial, Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 56px 28px 28px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 56px;
      justify-content: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
    }

    .logo {
      width: 96px;
      height: auto;
      display: block;
    }

    .brand-name {
      font-size: 13px;
      letter-spacing: 0.22em;
      color: var(--text);
    }

    .about {
      font-size: 14px;
      line-height: 2;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .links a {
      color: var(--text);
      text-decoration: none;
      transition: opacity .15s ease;
      display: inline-block;
      width: fit-content;
    }

    .links a:hover, .links a:focus-visible {
      opacity: 0.5;
      outline: none;
    }

    .footer {
      width: 100%;
      max-width: 480px;
      font-size: 11px;
      line-height: 1.9;
      color: var(--text-sub);
      letter-spacing: 0.02em;
      padding-top: 56px;
    }

    .footer p + p { margin-top: 4px; }

    @media (max-width: 480px) {
      body { padding: 40px 22px 24px; }
      .container { gap: 44px; }
      .footer { padding-top: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .links a { transition: none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="brand">
      <img class="logo" src="assets/logo.svg" alt="路 R O J O 上" width="96">
      <p class="brand-name">路 R O J O 上</p>
    </section>

    <section class="about">
      <p>A practice in Ueda.</p>
      <p>Articles · Dialog · Small Rental Property</p>
    </section>

    <nav class="links" aria-label="connect">
      <a href="mailto:mail@rojo.works">mail@rojo.works</a>
      <a href="https://www.instagram.com/rojo.works/" target="_blank" rel="noopener">Instagram @rojo.works</a>
      <a href="https://app.rojo.works/">Apps app.rojo.works</a>
    </nav>
  </main>

  <footer class="footer">
    <p>Cookie の使用、アクセス解析、外部トラッキングは行っていません。</p>
    <p>© 2026 路上</p>
  </footer>
</body>
</html>
